name: deploy-vercel

on:
  workflow_run:
    workflows: [quality]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_zmEezpOKGZy2sH5nqTfO44LD
      VERCEL_PROJECT_ID: prj_UL4T4q0fiT7KdEKoBLai6i44E4YS
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Resolve release revision
        id: revision
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check deployment authorization
        id: auth
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "## Production deployment blocked"
              echo
              echo "Repository certification passed, but the VERCEL_TOKEN GitHub Actions secret is not configured."
              echo "No production mutation was attempted. This release is not complete."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "VERCEL_TOKEN is required for production deployment." >&2
            exit 1
          fi

      - name: Check out certified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Stamp certified revision
        shell: bash
        run: |
          printf '{"sha":"%s"}\n' "${{ steps.revision.outputs.sha }}" > release.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@59.16.0

      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Stage certified production artifact without moving domains
        id: deploy
        shell: bash
        run: |
          url="$(vercel deploy --prod --skip-domain --yes --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## Staged production artifact"
            echo
            echo "Certified revision: \`${{ steps.revision.outputs.sha }}\`"
            echo "Immutable deployment: $url"
            echo "Production domains have not moved yet."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployed revision
        shell: bash
        run: |
          expected='{"sha":"${{ steps.revision.outputs.sha }}"}'
          deployment="${{ steps.deploy.outputs.url }}"
          for attempt in {1..12}; do
            marker="$(curl --silent --show-error "$deployment/release.json" || true)"
            status="$(curl --silent --show-error --output /tmp/deployment.html --write-out '%{http_code}' "$deployment/" || true)"
            if [ "$status" = "200" ] && [ "$marker" = "$expected" ] && grep -q 'id="app"' /tmp/deployment.html; then
              echo "Immutable deployment URL serves certified revision ${{ steps.revision.outputs.sha }}."
              break
            fi
            if [ "$attempt" = "12" ]; then
              echo "Deployment URL did not prove the certified revision." >&2
              exit 1
            fi
            sleep 5
          done

      - name: Promote verified artifact to production
        shell: bash
        run: |
          vercel promote "${{ steps.deploy.outputs.url }}" --yes --token="$VERCEL_TOKEN"
          {
            echo
            echo "Verified immutable artifact promoted to production."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify canonical production URL and exact SHA
        shell: bash
        run: |
          expected='{"sha":"${{ steps.revision.outputs.sha }}"}'
          canonical="https://earth-reference-rebuild.vercel.app"
          for attempt in {1..18}; do
            marker="$(curl --silent --show-error "$canonical/release.json" || true)"
            status="$(curl --silent --show-error --output /tmp/production.html --write-out '%{http_code}' "$canonical/" || true)"
            convergence="$(curl --silent --show-error --output /tmp/convergence.js --write-out '%{http_code}' "$canonical/earth-convergence.js" || true)"
            if [ "$status" = "200" ] && [ "$convergence" = "200" ] && [ "$marker" = "$expected" ] && grep -q 'id="app"' /tmp/production.html && grep -q 'EarthConvergence' /tmp/convergence.js; then
              {
                echo "## Production certification"
                echo
                echo "Canonical URL: $canonical"
                echo "Certified revision: `${{ steps.revision.outputs.sha }}`"
                echo "Exact release marker verified."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "Canonical production URL did not converge to the certified SHA." >&2
          exit 1
