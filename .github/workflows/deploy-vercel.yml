name: deploy-vercel

on:
  workflow_run:
    workflows: [quality]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        ) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      VERCEL_ORG_ID: team_zmEezpOKGZy2sH5nqTfO44LD
      VERCEL_PROJECT_ID: prj_UL4T4q0fiT7KdEKoBLai6i44E4YS
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Resolve current main revision with successful quality run
        id: revision
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              if (run.head_branch !== 'main' || run.head_repository?.full_name !== `${owner}/${repo}`) {
                core.setFailed('Production releases accept quality runs from this repository main only.');
                return;
              }
              if (run.head_sha !== main.data.commit.sha) {
                core.setFailed('A newer main revision exists; the older successful run cannot deploy.');
                return;
              }
              core.setOutput('sha', main.data.commit.sha);
              return;
            }
            if (context.ref !== 'refs/heads/main') {
              core.setFailed('Manual release dispatch must target main.');
              return;
            }
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'quality.yml', branch: 'main', status: 'success', per_page: 100
            });
            const quality = runs.data.workflow_runs.find(run =>
              run.name === 'quality' && run.event === 'push' && run.head_sha === main.data.commit.sha
            );
            if (!quality) {
              core.setFailed('Current main SHA has no successful push-triggered quality run.');
              return;
            }
            core.setOutput('sha', main.data.commit.sha);

      - name: Check deployment authorization
        id: auth
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "## Production deployment blocked"
              echo
              echo "Repository certification passed, but the VERCEL_TOKEN GitHub Actions secret is not configured."
              echo "No production mutation was attempted. This release is not complete."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "VERCEL_TOKEN is required for production deployment." >&2
            exit 1
          fi

      - name: Check out certified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify release source in Chromium before deployment
        env:
          EARTH_PORT: 4173
        run: npm run test:e2e
        timeout-minutes: 30
        continue-on-error: false

      - name: Stamp certified revision
        shell: bash
        run: |
          printf '{"sha":"%s"}\n' "${{ steps.revision.outputs.sha }}" > release.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@59.16.0

      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Capture current production deployment for rollback
        id: previous
        shell: bash
        run: |
          if vercel inspect "$CANONICAL_URL" --token="$VERCEL_TOKEN" --json > /tmp/previous-deployment.json 2>/dev/null; then
            rollback_raw="$(node -e 'const x=require("/tmp/previous-deployment.json");process.stdout.write(typeof x.url==="string"?x.url:"")')"
            rollback_url="$(node -e '
              try {
                const raw = process.argv[1].trim();
                const hasScheme = raw.startsWith("https://") || raw.startsWith("http://");
                const url = new URL(hasScheme ? raw : `https://${raw}`);
                if (url.protocol !== "https:" || !url.hostname.endsWith(".vercel.app") || url.username || url.password || url.port || !["", "/"].includes(url.pathname) || url.search || url.hash) process.exit(1);
                process.stdout.write(url.origin);
              } catch { process.exit(1); }
            ' "$rollback_raw" 2>/dev/null)" || rollback_url=""
            if [ -n "$rollback_url" ]; then
              echo "url=$rollback_url" >> "$GITHUB_OUTPUT"
              echo "Previous production deployment captured for rollback."
            else
              echo "Vercel inspect did not expose a safe rollback URL; refusing to deploy without rollback protection." >&2
              exit 1
            fi
          else
            echo "Vercel could not resolve the previous production deployment; refusing to deploy without rollback protection." >&2
            exit 1
          fi
        env:
          CANONICAL_URL: https://earth-reference-rebuild.vercel.app

      - name: Stage certified production artifact without moving domains
        id: deploy
        shell: bash
        run: |
          url="$(vercel deploy --prod --skip-domain --yes --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## Staged production artifact"
            echo
            echo "Certified revision: \`${{ steps.revision.outputs.sha }}\`"
            echo "Immutable deployment: $url"
            echo "Production domains have not moved yet."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployed revision
        shell: bash
        run: |
          expected='{"sha":"${{ steps.revision.outputs.sha }}"}'
          deployment="${{ steps.deploy.outputs.url }}"
          for attempt in {1..12}; do
            marker="$(curl --silent --show-error "$deployment/release.json" || true)"
            status="$(curl --silent --show-error --output /tmp/deployment.html --write-out '%{http_code}' "$deployment/" || true)"
          if [ "$status" = "200" ] && [ "$marker" = "$expected" ] && grep -q 'id="app"' /tmp/deployment.html; then
              echo "Immutable deployment URL serves certified revision ${{ steps.revision.outputs.sha }}."
              break
            fi
            if [ "$attempt" = "12" ]; then
              echo "Deployment URL did not prove the certified revision." >&2
              exit 1
            fi
            sleep 5
          done

      - name: Verify immutable deployment assets and exact release SHA
        env:
          EARTH_BASE_URL: ${{ steps.deploy.outputs.url }}
          EARTH_EXPECTED_SHA: ${{ steps.revision.outputs.sha }}
        run: npm run verify:release

      - name: Run browser acceptance against immutable deployment
        env:
          EARTH_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npm run test:e2e
        timeout-minutes: 30

      - name: Upload immutable candidate browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earth-production-candidate-browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

      - name: Promote verified artifact to production
        id: promotion
        shell: bash
        run: |
          vercel promote "${{ steps.deploy.outputs.url }}" --yes --token="$VERCEL_TOKEN"
          {
            echo
            echo "Verified immutable artifact promoted to production."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run full browser acceptance against canonical production
        if: success()
        env:
          EARTH_BASE_URL: https://earth-reference-rebuild.vercel.app
        run: npm run test:e2e
        timeout-minutes: 30

      - name: Prove canonical production release SHA and required assets
        if: success()
        env:
          EARTH_EXPECTED_SHA: ${{ steps.revision.outputs.sha }}
          EARTH_BASE_URL: https://earth-reference-rebuild.vercel.app
        run: npm run verify:release

      - name: Roll production alias back after failed browser acceptance
        if: failure() && steps.promotion.outcome == 'success' && steps.previous.outputs.url != ''
        shell: bash
        run: |
          vercel promote "${{ steps.previous.outputs.url }}" --yes --token="$VERCEL_TOKEN"
          {
            echo "## Rollback completed"
            echo
            echo "Production browser acceptance failed. The prior production deployment was promoted back."
            echo "Prior deployment: ${{ steps.previous.outputs.url }}"
            echo "Rejected candidate: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload canonical production browser evidence
        if: always() && steps.previous.outputs.url != ''
        uses: actions/upload-artifact@v4
        with:
          name: earth-canonical-production-browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
